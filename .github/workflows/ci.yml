name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ cmake libeigen3-dev

      - name: Build with CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Build with Makefile
        run: |
          make EIGEN_INC=/usr/include/eigen3
          make clean

      - name: Run smoke tests on 1emh.pdb
        run: |
          ./build/NucMutInt examples/1emh.pdb B 2 3 AC
          test -f 1emh_B_2_3_AC.pdb
          ! grep -i "nan" 1emh_B_2_3_AC.pdb
          ./build/NucMutInt examples/1emh.pdb B 2 3 AC C 21 22 TG
          test -f 1emh_B_2_3_AC_C_21_22_TG.pdb
          ./build/NucMutInt examples/1emh.pdb B 2 2 X
